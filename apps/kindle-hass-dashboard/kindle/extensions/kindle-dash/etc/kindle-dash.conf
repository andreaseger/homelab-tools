SERVER_URL="http://192.168.1.100:8080"
TOKEN="your_dashboard_token_here"
EVENT_DEV=""
# Set to 1 to skip TLS certificate validation when SERVER_URL uses https://
# (useful for self-signed/internal-CA certs). Leave at 0 for plain http or
# real public certs.
INSECURE_TLS=0
# Stop the Kindle UI framework while the dashboard runs so its native UI
# doesn't compete for the screen and react to taps that bleed through.
# Side effect: KUAL is unreachable while running (tap the [X] button in the
# top-left of the screen or SSH to stop). Set to 0 only if you'd rather
# keep the OS UI.
STOP_FRAMEWORK=1
# Trigger a full e-ink refresh every Nth successful frame to clear ghost
# pixels left behind by partial refreshes. Lower = less ghosting, more
# screen-flash. 0 disables full refresh entirely.
FULL_REFRESH_EVERY=10
