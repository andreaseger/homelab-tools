# Standalone package — this file exists only as pnpm's settings home
# (pnpm 11+ no longer reads the "pnpm" field in package.json).
# @scarf/scarf is analytics-only and core-js-pure ships prebuilt, so both are denied.
allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': true
  bun: true
  core-js-pure: false
  esbuild: true
  protobufjs: true
  tree-sitter: true
  tree-sitter-json: true
