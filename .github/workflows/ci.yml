name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      short_sha: ${{ steps.ctx.outputs.short_sha }}
      pr_number: ${{ steps.ctx.outputs.pr_number }}
      timestamp: ${{ steps.ctx.outputs.timestamp }}
    steps:
      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            HEAD_SHA="${{ github.sha }}"
            PR_NUM=""
          fi
          {
            echo "head_sha=$HEAD_SHA"
            echo "short_sha=${HEAD_SHA:0:7}"
            echo "pr_number=$PR_NUM"
            echo "timestamp=$(date -u +%Y%m%d%H%M%S)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ctx.outputs.head_sha }}
          fetch-depth: 0

      # Replaces `nx affected`: each app under apps/ is an independent package,
      # so "changed" is just "did anything under apps/<app>/ change".
      - name: Determine changed apps
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$PUSH_BEFORE"
          fi
          # New branch, force-push or shallow history: fall back to the parent commit.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse --verify --quiet "${HEAD_SHA}^" || true)"
          fi

          if [ -n "${BASE:-}" ]; then
            CHANGED="$(git diff --name-only "$BASE" "$HEAD_SHA")"
          else
            CHANGED="$(git ls-files)"   # no usable base: treat everything as changed
          fi
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # Repo-wide files that affect how every app is built or shipped.
          if echo "$CHANGED" | grep -qE '^(\.github/workflows/|\.tool-versions$)'; then
            ALL=1
          else
            ALL=0
          fi

          MATRIX='[]'
          for dir in apps/*/; do
            app="$(basename "$dir")"
            # Skip stray directories: a dir without a package.json is not an app,
            # and jq would emit an empty platforms string for it.
            [ -f "${dir}package.json" ] || continue
            if [ "$ALL" = "1" ] || echo "$CHANGED" | grep -q "^apps/${app}/"; then
              platforms="$(jq -r '.docker.platforms // "linux/amd64"' "${dir}package.json")"
              MATRIX="$(echo "$MATRIX" | jq -c \
                --arg app "$app" --arg platforms "$platforms" \
                '. + [{app: $app, platforms: $platforms}]')"
            fi
          done

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Matrix: {\"include\":$MATRIX}"

  # Repo-level, not per-app: Prettier is the one tool that lives at the root.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check

  verify:
    needs: changes
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.changes.outputs.head_sha }}

      # Installs node and pnpm at the versions pinned in .tool-versions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm run --if-present typecheck

      - run: pnpm run --if-present build

  build-and-push:
    needs: [changes, verify]
    if: needs.changes.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.changes.outputs.head_sha }}

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose tag list
        id: taglist
        env:
          EVENT: ${{ github.event_name }}
          SHORT_SHA: ${{ needs.changes.outputs.short_sha }}
          TS: ${{ needs.changes.outputs.timestamp }}
          PR_NUM: ${{ needs.changes.outputs.pr_number }}
        run: |
          {
            echo "tags<<EOF"
            if [ "$EVENT" = "pull_request" ]; then
              echo "type=raw,value=pr-${PR_NUM}"
              echo "type=raw,value=pr-${PR_NUM}-${TS}-${SHORT_SHA}"
              echo "type=sha,prefix="
            else
              echo "type=raw,value=latest"
              echo "type=raw,value=main"
              echo "type=raw,value=main-${TS}-${SHORT_SHA}"
              echo "type=sha,prefix="
              echo "type=raw,value={{date 'YYYY-MM-DD'}}"
              echo "type=raw,value={{date 'YYMMDD'}}.{{sha}}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read tool versions
        id: tools
        run: |
          {
            echo "node=$(awk '$1=="node"{print $2}' .tool-versions)"
            echo "pnpm=$(awk '$1=="pnpm"{print $2}' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: ${{ steps.taglist.outputs.tags }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            NODE_VERSION=${{ steps.tools.outputs.node }}
            PNPM_VERSION=${{ steps.tools.outputs.pnpm }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
