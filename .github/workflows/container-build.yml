name: Build and Push Containers

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get affected apps with docker:build target
        id: affected
        run: |
          APPS=$(bun nx show projects --affected --withTarget docker:build --json 2>/dev/null || echo "[]")
          echo "apps=$APPS" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.affected.outputs.apps != '[]'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.affected.outputs.apps != '[]'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.affected.outputs.apps != '[]'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push affected apps
        if: steps.affected.outputs.apps != '[]'
        run: |
          echo "${{ steps.affected.outputs.apps }}" | jq -r '.[]' | while read app; do
            echo "Building and pushing $app..."
            bun nx run $app:docker:build:ci
          done
