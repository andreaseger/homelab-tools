name: Build and Push Containers

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set SHAs for affected detection
        uses: nrwl/nx-set-shas@v4
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build matrix from affected apps
        id: matrix
        run: |
          APPS=$(pnpm nx show projects --affected --withTarget docker:build --json 2>/dev/null || echo "[]")

          # For each affected app, collect platform:* tags into a comma-separated platforms string
          MATRIX="[]"
          for app in $(echo "$APPS" | jq -r '.[]'); do
            PROJECT=$(pnpm nx show project "$app" --json 2>/dev/null)
            # Skip apps tagged with release:skip
            if echo "$PROJECT" | jq -e '.tags // [] | index("release:skip")' > /dev/null; then continue; fi
            PLATFORMS=$(echo "$PROJECT" \
              | jq -r '.tags // [] | .[] | select(startswith("platform:")) | sub("^platform:"; "linux/")' \
              | paste -sd,)
            # Default to linux/amd64 if no platform tags are set
            PLATFORMS="${PLATFORMS:-linux/amd64}"
            MATRIX=$(echo "$MATRIX" | jq -c --arg app "$app" --arg platforms "$PLATFORMS" '. + [{app: $app, platforms: $platforms}]')
          done

          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=raw,value={{date 'YYMMDD'}}.{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
