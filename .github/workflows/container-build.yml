name: Build and Push Containers

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set SHAs for affected detection
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build matrix from affected apps
        id: matrix
        run: |
          APPS=$(pnpm nx show projects --affected --withTarget docker:build --json 2>/dev/null || echo "[]")

          # For each affected app, collect platform:* tags into a comma-separated platforms string
          MATRIX="[]"
          for app in $(echo "$APPS" | jq -r '.[]'); do
            PROJECT=$(pnpm nx show project "$app" --json 2>/dev/null)
            # Skip apps tagged with release:skip
            if echo "$PROJECT" | jq -e '.tags // [] | index("release:skip")' > /dev/null; then continue; fi
            PLATFORMS=$(echo "$PROJECT" \
              | jq -r '.tags // [] | .[] | select(startswith("platform:")) | sub("^platform:"; "linux/")' \
              | paste -sd,)
            # Default to linux/amd64 if no platform tags are set
            PLATFORMS="${PLATFORMS:-linux/amd64}"
            MATRIX=$(echo "$MATRIX" | jq -c --arg app "$app" --arg platforms "$PLATFORMS" '. + [{app: $app, platforms: $platforms}]')
          done

          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=raw,value={{date 'YYMMDD'}}.{{sha}}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          build-contexts: workspace=.
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
