packages:
  - "apps/*"
  - "packages/*"

# Required by `pnpm deploy` (pnpm 10+) — none of our apps actually consume sibling
# workspace packages, so injection is a no-op for us, but the deploy algorithm
# refuses to run without it set.
injectWorkspacePackages: true

# pnpm 11 requires an explicit allowlist for postinstall/build scripts.
# All entries here are required (native compilation or first-party tools);
# @scarf/scarf is analytics-only and core-js-pure ships prebuilt, so they're denied.
allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': true
  better-sqlite3: true
  bun: true
  core-js-pure: false
  esbuild: true
  nx: true
  protobufjs: true
  tree-sitter: true
  tree-sitter-json: true
